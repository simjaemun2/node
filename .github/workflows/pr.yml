name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate pinned Base source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'export BASE_RETH_NODE_COMMIT=39e30a1fc54c63297850d313a3876e1522a753f3' versions.env
          grep -Fx 'export BASE_RETH_NODE_REPO=git@github.com:simjaemun2/base.git' versions.env
          grep -Fx 'export BASE_RETH_NODE_TAG=v1.2.0-mev' versions.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Check the Docker build definition
        run: docker buildx build --check --build-arg FEATURES=jemalloc,asm-keccak,optimism .
